name: beefy-databarn

x-clickhouse-image: &clickhouse-image clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-26.8.4}

services:
  traefik:
    image: traefik:v3.6
    command:
      - '--configfile=/traefik.yml'
      - '--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_EMAIL}'
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ../traefik/traefik.yml:/traefik.yml
      - traefik_certs:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      TRAEFIK_DOCKER_NETWORK: beefy-databarn_frontend_network
      TRAEFIK_LOG_LEVEL: ${TRAEFIK_LOG_LEVEL:-INFO}
      TRAEFIK_EMAIL: ${TRAEFIK_EMAIL}
    networks:
      - frontend_network
    labels:
      - "traefik.enable=false"
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
    logging:
      driver: "local"
      options:
        max-size: "1G"
        max-file: "3"
    restart: unless-stopped

  clickhouse:
    image: *clickhouse-image
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ../clickhouse/users.xml:/etc/clickhouse-server/users.xml:ro
      - ../clickhouse/init-clickhouse.sh:/docker-entrypoint-initdb.d/init-clickhouse.sh:ro
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_MAX_MEMORY_USAGE: ${CLICKHOUSE_MAX_MEMORY_USAGE:-32212254720}
      CLICKHOUSE_USE_UNCOMPRESSED_CACHE: ${CLICKHOUSE_USE_UNCOMPRESSED_CACHE:-1}
      CLICKHOUSE_MAX_THREADS: ${CLICKHOUSE_MAX_THREADS:-32}
      CLICKHOUSE_MAX_INSERT_THREADS: ${CLICKHOUSE_MAX_INSERT_THREADS:-16}
      CLICKHOUSE_MAX_FINAL_THREADS: ${CLICKHOUSE_MAX_FINAL_THREADS:-32}
      CLICKHOUSE_PARALLEL_VIEW_PROCESSING: ${CLICKHOUSE_PARALLEL_VIEW_PROCESSING:-1}
      CLICKHOUSE_USE_ASYNC_EXECUTOR_FOR_MATERIALIZED_VIEWS: ${CLICKHOUSE_USE_ASYNC_EXECUTOR_FOR_MATERIALIZED_VIEWS:-1}
      CLICKHOUSE_MAX_BYTES_BEFORE_EXTERNAL_SORT: ${CLICKHOUSE_MAX_BYTES_BEFORE_EXTERNAL_SORT:-17179869184}
      CLICKHOUSE_MAX_BYTES_BEFORE_EXTERNAL_GROUP_BY: ${CLICKHOUSE_MAX_BYTES_BEFORE_EXTERNAL_GROUP_BY:-17179869184}
      CLICKHOUSE_MAX_CONNECTIONS: ${CLICKHOUSE_MAX_CONNECTIONS:-100}
      CLICKHOUSE_MAX_CONCURRENT_QUERIES: ${CLICKHOUSE_MAX_CONCURRENT_QUERIES:-100}
      CLICKHOUSE_UNCOMPRESSED_CACHE_SIZE: ${CLICKHOUSE_UNCOMPRESSED_CACHE_SIZE:-10737418240}
      CLICKHOUSE_MARK_CACHE_SIZE: ${CLICKHOUSE_MARK_CACHE_SIZE:-10737418240}
      CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS: ${CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS:-1}
      CLICKHOUSE_BACKUP_PASSWORD: ${CLICKHOUSE_BACKUP_PASSWORD:-${CLICKHOUSE_PASSWORD}}
      CLICKHOUSE_BACKUP_ALLOWED_HOST: IP '172.19.1.0/24'
      CLICKHOUSE_BACKUP_S3_DISK_ENDPOINT: ${CLICKHOUSE_BACKUP_S3_DISK_ENDPOINT:-http://rustfs:9000/clickhouse-backups/}
      CLICKHOUSE_BACKUP_S3_ACCESS_KEY: ${CLICKHOUSE_BACKUP_S3_ACCESS_KEY:-${RUSTFS_ACCESS_KEY:-admin}}
      CLICKHOUSE_BACKUP_S3_SECRET_KEY: ${CLICKHOUSE_BACKUP_S3_SECRET_KEY:-${RUSTFS_SECRET_KEY}}
      BEEFY_HISTORY_S3_EVENTS_URL: ${BEEFY_HISTORY_S3_EVENTS_URL:-http://rustfs:9000/beefy-history/current/events.parquet}
      BEEFY_HISTORY_S3_ISSUES_URL: ${BEEFY_HISTORY_S3_ISSUES_URL:-http://rustfs:9000/beefy-history/current/issues.parquet}
      DBT_CLICKHOUSE_PASSWORD: ${DBT_CLICKHOUSE_PASSWORD}
      DBT_CLICKHOUSE_ALLOWED_HOST: IP '172.19.1.0/24'
      DLT_CLICKHOUSE_PASSWORD: ${DLT_CLICKHOUSE_PASSWORD}
      DLT_CLICKHOUSE_ALLOWED_HOST: IP '172.19.1.0/24'
      SUPERSET_CLICKHOUSE_PASSWORD: ${SUPERSET_CLICKHOUSE_PASSWORD}
      SUPERSET_CLICKHOUSE_ALLOWED_HOST: IP '172.19.1.0/24'
      GRAFANA_CLICKHOUSE_PASSWORD: ${GRAFANA_CLICKHOUSE_PASSWORD}
      GRAFANA_CLICKHOUSE_ALLOWED_HOST: IP '172.19.1.0/24'
      API_CLICKHOUSE_PASSWORD: ${API_CLICKHOUSE_PASSWORD}
      API_CLICKHOUSE_ALLOWED_HOST: IP '172.19.1.0/24'
      ENVIO_CLICKHOUSE_PASSWORD: ${ENVIO_CLICKHOUSE_PASSWORD}
      ENVIO_CLICKHOUSE_ALLOWED_HOST: IP '172.19.0.0/24' # external
      ENVIO_MAX_MEMORY_USAGE: ${ENVIO_MAX_MEMORY_USAGE:-4000000000}
      ENVIO_MAX_EXECUTION_TIME: ${ENVIO_MAX_EXECUTION_TIME:-120}
      ENVIO_MAX_INSERT_THREADS: ${ENVIO_MAX_INSERT_THREADS:-4}
      ENVIO_MAX_INSERT_BLOCK_SIZE: ${ENVIO_MAX_INSERT_BLOCK_SIZE:-65536}
      ENVIO_MAX_PARTITIONS_PER_INSERT_BLOCK: ${ENVIO_MAX_PARTITIONS_PER_INSERT_BLOCK:-100}
      ENVIO_MAX_RESULT_ROWS: ${ENVIO_MAX_RESULT_ROWS:-100000}
      ENVIO_MAX_ROWS_TO_READ: ${ENVIO_MAX_ROWS_TO_READ:-1000000}
      ENVIO_QUOTA_INSERTS_PER_SECOND: ${ENVIO_QUOTA_INSERTS_PER_SECOND:-200}
      ENVIO_QUOTA_WRITTEN_BYTES_PER_SECOND: ${ENVIO_QUOTA_WRITTEN_BYTES_PER_SECOND:-52428800}
      ENVIO_QUOTA_INSERTS_PER_HOUR: ${ENVIO_QUOTA_INSERTS_PER_HOUR:-500000}
      ENVIO_QUOTA_WRITTEN_BYTES_PER_HOUR: ${ENVIO_QUOTA_WRITTEN_BYTES_PER_HOUR:-10737418240}
      ENVIO_QUOTA_WRITTEN_BYTES_PER_DAY: ${ENVIO_QUOTA_WRITTEN_BYTES_PER_DAY:-107374182400}
      ZAPALYTICS_CLICKHOUSE_PASSWORD: ${ZAPALYTICS_CLICKHOUSE_PASSWORD}
      ZAPALYTICS_CLICKHOUSE_ALLOWED_HOST: IP '172.19.0.0/24' # external
      ZAPALYTICS_MAX_MEMORY_USAGE: ${ZAPALYTICS_MAX_MEMORY_USAGE:-1000000000}
      ZAPALYTICS_MAX_EXECUTION_TIME: ${ZAPALYTICS_MAX_EXECUTION_TIME:-30}
      ZAPALYTICS_MAX_INSERT_THREADS: ${ZAPALYTICS_MAX_INSERT_THREADS:-1}
      ZAPALYTICS_MAX_INSERT_BLOCK_SIZE: ${ZAPALYTICS_MAX_INSERT_BLOCK_SIZE:-8192}
      ZAPALYTICS_MAX_PARTITIONS_PER_INSERT_BLOCK: ${ZAPALYTICS_MAX_PARTITIONS_PER_INSERT_BLOCK:-10}
      ZAPALYTICS_MAX_RESULT_ROWS: ${ZAPALYTICS_MAX_RESULT_ROWS:-100000}
      ZAPALYTICS_MAX_ROWS_TO_READ: ${ZAPALYTICS_MAX_ROWS_TO_READ:-1000000}
      ZAPALYTICS_QUOTA_INSERTS_PER_SECOND: ${ZAPALYTICS_QUOTA_INSERTS_PER_SECOND:-5}
      ZAPALYTICS_QUOTA_WRITTEN_BYTES_PER_SECOND: ${ZAPALYTICS_QUOTA_WRITTEN_BYTES_PER_SECOND:-5242880}
      ZAPALYTICS_QUOTA_INSERTS_PER_HOUR: ${ZAPALYTICS_QUOTA_INSERTS_PER_HOUR:-500}
      ZAPALYTICS_QUOTA_WRITTEN_BYTES_PER_HOUR: ${ZAPALYTICS_QUOTA_WRITTEN_BYTES_PER_HOUR:-104857600}
      ZAPALYTICS_QUOTA_WRITTEN_BYTES_PER_DAY: ${ZAPALYTICS_QUOTA_WRITTEN_BYTES_PER_DAY:-1073741824}
      CLICKHOUSE_WEB_MAX_EXECUTION_TIME: ${CLICKHOUSE_WEB_MAX_EXECUTION_TIME:-3600}
      CLICKHOUSE_WEB_MAX_MEMORY_USAGE: ${CLICKHOUSE_WEB_MAX_MEMORY_USAGE:-32212254720}
      CLICKHOUSE_WEB_MAX_RESULT_ROWS: ${CLICKHOUSE_WEB_MAX_RESULT_ROWS:-1000000000}
      CLICKHOUSE_WEB_MAX_ROWS_TO_READ: ${CLICKHOUSE_WEB_MAX_ROWS_TO_READ:-1000000000}
    networks:
      - backend_network
      - frontend_network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=beefy-databarn_frontend_network"
      - "traefik.http.routers.clickhouse.rule=Host(`${CLICKHOUSE_EXTERNAL_DOMAIN_NAME}`)"
      - "traefik.http.routers.clickhouse.entrypoints=websecure"
      - "traefik.http.routers.clickhouse.tls.certresolver=letsencrypt"
      # No buffering middleware: oxy buffer breaks ClickHouse HTTP (DDL, short responses → "no data ready" / connection reset).
      - "traefik.http.routers.clickhouse.middlewares=clickhouse-ratelimit"
      - "traefik.http.middlewares.clickhouse-ratelimit.ratelimit.average=300"
      - "traefik.http.middlewares.clickhouse-ratelimit.ratelimit.period=1s"
      - "traefik.http.middlewares.clickhouse-ratelimit.ratelimit.burst=100"
      - "traefik.http.middlewares.clickhouse-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth=1"
      - "traefik.http.services.clickhouse.loadbalancer.server.port=8123"
      - "traefik.http.services.clickhouse.loadbalancer.server.scheme=http"
      - "traefik.http.services.clickhouse.loadbalancer.healthcheck.path=/ping"
      - "traefik.http.services.clickhouse.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.clickhouse.loadbalancer.healthcheck.timeout=5s"
      - "traefik.http.routers.clickhouse.service=clickhouse"
    healthcheck:
      test: wget -O - --no-verbose --tries=1 http://127.0.0.1:8123/ping || exit 1
      interval: 1s
      timeout: 20s
      retries: 30
    logging:
      driver: "local"
      options:
        max-size: "1G"
        max-file: "3"

  clickhouse-backup:
    image: beefy-databarn-clickhouse-backup:${CLICKHOUSE_VERSION:-26.8.4}
    pull_policy: build
    build:
      context: ..
      dockerfile: clickhouse/Dockerfile.backup
      args:
        CLICKHOUSE_IMAGE: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-26.8.4}
    entrypoint: ["/bin/bash", "/opt/backup-loop.sh"]
    command: ["daemon"]
    volumes:
      - ../clickhouse/backup-loop.sh:/opt/backup-loop.sh:ro
    environment:
      CLICKHOUSE_BACKUP_CH_HOST: clickhouse
      CLICKHOUSE_BACKUP_CH_USER: backup
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_BACKUP_PASSWORD: ${CLICKHOUSE_BACKUP_PASSWORD:-${CLICKHOUSE_PASSWORD}}
      CLICKHOUSE_BACKUP_S3_ENDPOINT: ${CLICKHOUSE_BACKUP_S3_ENDPOINT:-http://rustfs:9000}
      CLICKHOUSE_BACKUP_S3_BUCKET: ${CLICKHOUSE_BACKUP_S3_BUCKET:-clickhouse-backups}
      CLICKHOUSE_BACKUP_S3_ACCESS_KEY: ${CLICKHOUSE_BACKUP_S3_ACCESS_KEY:-${RUSTFS_ACCESS_KEY:-admin}}
      CLICKHOUSE_BACKUP_S3_SECRET_KEY: ${CLICKHOUSE_BACKUP_S3_SECRET_KEY:-${RUSTFS_SECRET_KEY}}
      CLICKHOUSE_BACKUP_KEEP_FULLS: ${CLICKHOUSE_BACKUP_KEEP_FULLS:-2}
      CLICKHOUSE_BACKUP_KEEP_INCREMENTAL_DAYS: ${CLICKHOUSE_BACKUP_KEEP_INCREMENTAL_DAYS:-1}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-admin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    networks:
      - backend_network
    depends_on:
      clickhouse:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "traefik.enable=false"
    logging:
      driver: "local"
      options:
        max-size: "1G"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.7.3
    volumes:
      - prometheus_data:/prometheus
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ../prometheus/alerts.yml:/etc/prometheus/alerts.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - backend_network
    labels:
      - "traefik.enable=false"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/metrics"]
      interval: 1s
      timeout: 20s
      retries: 10
    depends_on:
      clickhouse:
        condition: service_healthy
    logging:
      driver: "local"
      options:
        max-size: "1G"
        max-file: "3"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.1
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning
      - ../grafana/dashboards:/etc/grafana/dashboards
      - ../grafana/custom.ini:/etc/grafana/grafana.ini
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_SERVER_DOMAIN: ${GRAFANA_WEBAPP_DOMAIN_NAME}
      GF_LOG_LEVEL: ${GRAFANA_LOG_LEVEL:-info}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY}
      GF_SECRETS_MANAGER_ENCRYPTION_SECRET_KEY_V1: ${GRAFANA_SECRET_KEY}
      GF_SERVER_HTTP_ADDR: ${GRAFANA_HTTP_ADDR:-0.0.0.0}
      GF_SERVER_HTTP_PORT: ${GRAFANA_HTTP_PORT:-3000}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_ADMIN_EMAIL: ${GRAFANA_ADMIN_EMAIL:-admin@localhost}
      GF_DATABASE_HOST: ${GRAFANA_POSTGRES_HOST:-postgres}
      GF_DATABASE_PORT: ${GRAFANA_POSTGRES_PORT:-5432}
      GF_DATABASE_USER: ${GRAFANA_POSTGRES_USER:-grafana}
      GF_DATABASE_PASSWORD: ${GRAFANA_POSTGRES_PASSWORD}
      GF_DATABASE_NAME: ${GRAFANA_POSTGRES_DB:-grafana}
      GF_REMOTE_CACHE_CONNSTR: ${GRAFANA_REDIS_CONNSTR:-addr=redis:6379,pool_size=100,db=2,ssl=false}
      GF_REMOTE_CACHE_PREFIX: ${GRAFANA_REDIS_PREFIX:-grafana:}
      GF_AUTH_GITHUB_CLIENT_ID: ${GRAFANA_GITHUB_CLIENT_ID}
      GF_AUTH_GITHUB_CLIENT_SECRET: ${GRAFANA_GITHUB_CLIENT_SECRET}
      GF_AUTH_GITHUB_ALLOWED_ORGANIZATIONS: ${GRAFANA_GITHUB_ALLOWED_ORG}
      # datasource config
      GRAFANA_CLICKHOUSE_HOST: ${GRAFANA_CLICKHOUSE_HOST:-clickhouse}
      GRAFANA_CLICKHOUSE_PORT: 8123
      GRAFANA_CLICKHOUSE_USER: ${GRAFANA_CLICKHOUSE_USER:-grafana}
      GRAFANA_CLICKHOUSE_PASSWORD: ${GRAFANA_CLICKHOUSE_PASSWORD}
      GRAFANA_CLICKHOUSE_DB: ${GRAFANA_CLICKHOUSE_DB:-analytics}
    networks:
      - backend_network
      - frontend_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_WEBAPP_DOMAIN_NAME}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=${GRAFANA_HTTP_PORT:-3000}"
      - "traefik.http.services.grafana.loadbalancer.server.scheme=http"
      - "traefik.http.services.grafana.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.grafana.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.grafana.loadbalancer.healthcheck.timeout=5s"
      - "traefik.http.routers.grafana.service=grafana"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1",
        ]
      interval: 1s
      timeout: 20s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    logging:
      driver: "local"
      options:
        max-size: "1G"
        max-file: "3"
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.0
    volumes:
      - rustfs_data:/data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-admin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "false"
    networks:
      - backend_network
    labels:
      - "traefik.enable=false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 1s
      timeout: 20s
      retries: 10
    logging:
      driver: "local"
      options:
        max-size: "1G"
        max-file: "3"
    restart: unless-stopped

  rustfs-init:
    image: minio/mc:latest
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-admin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CLICKHOUSE_BACKUP_BUCKET: ${CLICKHOUSE_BACKUP_S3_BUCKET:-clickhouse-backups}
      RUSTFS_BEEFY_HISTORY_BUCKET: ${BEEFY_HISTORY_S3_BUCKET:-beefy-history}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Configuring mc alias for RustFS..."
        mc alias set rustfs http://rustfs:9000 "$${RUSTFS_ACCESS_KEY}" "$${RUSTFS_SECRET_KEY}"
        echo "Creating bucket $${RUSTFS_CLICKHOUSE_BACKUP_BUCKET}..."
        mc mb rustfs/$${RUSTFS_CLICKHOUSE_BACKUP_BUCKET} || true
        echo "Creating bucket $${RUSTFS_BEEFY_HISTORY_BUCKET}..."
        mc mb rustfs/$${RUSTFS_BEEFY_HISTORY_BUCKET} || true
        echo "Buckets ready."
    networks:
      - backend_network
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"

  postgres:
    image: pgautoupgrade/pgautoupgrade:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh
    environment:
      POSTGRES_DB: ${POSTGRES_ADMIN_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
      SUPERSET_POSTGRES_DB: ${SUPERSET_POSTGRES_DB:-superset}
      SUPERSET_POSTGRES_USER: ${SUPERSET_POSTGRES_USER:-superset}
      SUPERSET_POSTGRES_PASSWORD: ${SUPERSET_POSTGRES_PASSWORD}
      GRAFANA_POSTGRES_DB: ${GRAFANA_POSTGRES_DB:-grafana}
      GRAFANA_POSTGRES_USER: ${GRAFANA_POSTGRES_USER:-grafana}
      GRAFANA_POSTGRES_PASSWORD: ${GRAFANA_POSTGRES_PASSWORD}
    networks:
      - backend_network
    restart: on-failure
    labels:
      - "traefik.enable=false"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "local"
      options:
        max-size: "1G"
        max-file: "3"

  redis:
    image: redis:8-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - backend_network
    restart: on-failure
    labels:
      - "traefik.enable=false"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "local"
      options:
        max-size: "1G"
        max-file: "3"

  redis_exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: redis:6379
    networks:
      - backend_network
    restart: on-failure
    labels:
      - "traefik.enable=false"
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "local"
      options:
        max-size: "1G"
        max-file: "3"

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.18.1
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_ADMIN_USER:-postgres}:${POSTGRES_ADMIN_PASSWORD:-postgres}@postgres:5432/${POSTGRES_ADMIN_DB:-postgres}?sslmode=disable
    networks:
      - backend_network
    restart: on-failure
    labels:
      - "traefik.enable=false"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9187/metrics"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "local"
      options:
        max-size: "1G"
        max-file: "3"

  superset:
    build:
      context: ../superset
      dockerfile: Dockerfile
    image: beefy-databarn-superset:latest
    volumes:
      - superset_data:/app/superset_home
      - ../superset/provision:/usr/local/bin/provision
      - ../superset/docker-entrypoint-wrapper.sh:/app/docker-entrypoint-wrapper.sh
      - ../superset/superset_config.py:/app/superset_config.py
      - ../superset/github_security_manager.py:/app/pythonpath/github_security_manager.py
    command: ["/app/docker-entrypoint-wrapper.sh"]
    environment:
      SUPERSET_WEBAPP_DOMAIN_NAME: ${SUPERSET_WEBAPP_DOMAIN_NAME}
      SUPERSET_ENV: ${SUPERSET_ENV:-production}
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      POSTGRES_USER: ${SUPERSET_POSTGRES_USER:-superset}
      POSTGRES_PASSWORD: ${SUPERSET_POSTGRES_PASSWORD}
      POSTGRES_DB: ${SUPERSET_POSTGRES_DB:-superset}
      SUPERSET_POSTGRES_HOST: postgres
      SUPERSET_POSTGRES_PORT: 5432
      SUPERSET_POSTGRES_USER: ${SUPERSET_POSTGRES_USER:-superset}
      SUPERSET_POSTGRES_PASSWORD: ${SUPERSET_POSTGRES_PASSWORD}
      SUPERSET_POSTGRES_DB: ${SUPERSET_POSTGRES_DB:-superset}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@example.com}
      SUPERSET_CLICKHOUSE_HOST: ${SUPERSET_CLICKHOUSE_HOST}
      SUPERSET_CLICKHOUSE_PORT: 8123
      SUPERSET_CLICKHOUSE_USER: ${SUPERSET_CLICKHOUSE_USER:-superset}
      SUPERSET_CLICKHOUSE_PASSWORD: ${SUPERSET_CLICKHOUSE_PASSWORD}
      SUPERSET_CLICKHOUSE_DB: ${SUPERSET_CLICKHOUSE_DB:-analytics}
      SUPERSET_REDIS_HOST: redis
      SUPERSET_REDIS_PORT: 6379
      SUPERSET_REDIS_CELERY_DB: ${SUPERSET_REDIS_CELERY_DB:-0}
      SUPERSET_REDIS_RESULTS_DB: ${SUPERSET_REDIS_RESULTS_DB:-1}
      # GitHub OAuth Configuration
      SUPERSET_GITHUB_CLIENT_ID: ${SUPERSET_GITHUB_CLIENT_ID:-}
      SUPERSET_GITHUB_CLIENT_SECRET: ${SUPERSET_GITHUB_CLIENT_SECRET:-}
      SUPERSET_GITHUB_API_BASE_URL: ${SUPERSET_GITHUB_API_BASE_URL:-}
      SUPERSET_GITHUB_ACCESS_TOKEN_URL: ${SUPERSET_GITHUB_ACCESS_TOKEN_URL:-}
      SUPERSET_GITHUB_AUTHORIZE_URL: ${SUPERSET_GITHUB_AUTHORIZE_URL:-}
      SUPERSET_GITHUB_ALLOWED_ORG: ${SUPERSET_GITHUB_ALLOWED_ORG:-}
      SUPERSET_AUTH_USER_REGISTRATION_ROLE: ${SUPERSET_AUTH_USER_REGISTRATION_ROLE:-Gamma}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/health || exit 1"]
      interval: 1s
      timeout: 10s
      retries: 20
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.superset.rule=Host(`${SUPERSET_WEBAPP_DOMAIN_NAME}`)"
      - "traefik.http.routers.superset.entrypoints=websecure"
      - "traefik.http.routers.superset.tls.certresolver=letsencrypt"
      - "traefik.http.services.superset.loadbalancer.server.port=8088"
      - "traefik.http.services.superset.loadbalancer.server.scheme=http"
      - "traefik.http.services.superset.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.superset.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.superset.loadbalancer.healthcheck.timeout=5s"
      - "traefik.http.routers.superset.service=superset"
    networks:
      - backend_network
      - frontend_network
    logging:
      driver: "local"
      options:
        max-size: "1G"
        max-file: "3"
    restart: unless-stopped

  dbt:
    build:
      context: ../..
      dockerfile: infra/dbt/Dockerfile
    image: beefy-databarn-dbt:latest
    volumes:
      - dbt_data:/app/dbt/target
      - dbt_docs:/app/dbt-docs
      - ../../dbt:/app/dbt
    environment:
      DBT_TARGET: prod
      DBT_RUN_LOCKFILE: ${DBT_RUN_LOCKFILE:-/app/dbt/.dbt_run.lock}
      DBT_RUN_LOCK_TIMEOUT: ${DBT_RUN_LOCK_TIMEOUT:-30}
      DBT_CLICKHOUSE_HOST: ${DBT_CLICKHOUSE_HOST:-clickhouse}
      DBT_CLICKHOUSE_PORT: 8123
      DBT_CLICKHOUSE_USER: ${DBT_CLICKHOUSE_USER:-dbt}
      DBT_CLICKHOUSE_PASSWORD: ${DBT_CLICKHOUSE_PASSWORD}
      DBT_CLICKHOUSE_DB: ${DBT_CLICKHOUSE_DB:-analytics}
      DBT_ENVIO_BALANCES_DB: ${DBT_ENVIO_BALANCES_DB:-envio}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DOCGLOW_NO_TELEMETRY: "1"
    networks:
      - backend_network
    restart: on-failure
    labels:
      - "traefik.enable=false"
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'scheduler.py' > /dev/null && exit 0 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "local"
      options:
        max-size: "1G"
        max-file: "3"

  dbt-docs:
    image: nginx:1.27-alpine
    volumes:
      - dbt_docs:/usr/share/nginx/html:ro
      - ../dbt/docs-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend_network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=beefy-databarn_frontend_network"
      - "traefik.http.routers.dbt-docs.rule=Host(`${DBT_DOCS_WEBAPP_DOMAIN_NAME}`)"
      - "traefik.http.routers.dbt-docs.entrypoints=websecure"
      - "traefik.http.routers.dbt-docs.tls.certresolver=letsencrypt"
      - "traefik.http.services.dbt-docs.loadbalancer.server.port=80"
      - "traefik.http.services.dbt-docs.loadbalancer.server.scheme=http"
      - "traefik.http.services.dbt-docs.loadbalancer.healthcheck.path=/healthz"
      - "traefik.http.services.dbt-docs.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.dbt-docs.loadbalancer.healthcheck.timeout=5s"
      - "traefik.http.routers.dbt-docs.service=dbt-docs"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "local"
      options:
        max-size: "1G"
        max-file: "3"

  dlt:
    build:
      context: ../..
      dockerfile: infra/dlt/Dockerfile
    image: beefy-databarn-dlt:latest
    volumes:
      - ../../dlt:/app/dlt
      # DLT writes pipeline data (load/loaded/completed_jobs) to /var/dlt – mount volume so it does not fill the container overlay
      - dlt_data:/var/dlt
      # Git mirrors + local parquet store for the beefy-history CLI (not the ClickHouse backup volume)
      - beefy_history_data:/var/beefy-history
    environment:
      DLT_ENV: ${DLT_ENV:-production}
      STORAGE_DIR: ${STORAGE_DIR}
      BEEFY_HISTORY_DIR: /opt/beefy-history
      BEEFY_HISTORY_DATA_DIR: /var/beefy-history
      BEEFY_HISTORY_S3_ENDPOINT: ${BEEFY_HISTORY_S3_ENDPOINT:-http://rustfs:9000}
      BEEFY_HISTORY_S3_BUCKET: ${BEEFY_HISTORY_S3_BUCKET:-beefy-history}
      BEEFY_HISTORY_S3_ACCESS_KEY: ${BEEFY_HISTORY_S3_ACCESS_KEY:-${CLICKHOUSE_BACKUP_S3_ACCESS_KEY:-${RUSTFS_ACCESS_KEY:-admin}}}
      BEEFY_HISTORY_S3_SECRET_KEY: ${BEEFY_HISTORY_S3_SECRET_KEY:-${CLICKHOUSE_BACKUP_S3_SECRET_KEY:-${RUSTFS_SECRET_KEY}}}
      # ClickHouse configuration
      DLT_CLICKHOUSE_HOST: ${DLT_CLICKHOUSE_HOST:-clickhouse}
      DLT_CLICKHOUSE_PORT: ${DLT_CLICKHOUSE_PORT:-9000}
      DLT_CLICKHOUSE_HTTP_PORT: ${DLT_CLICKHOUSE_HTTP_PORT:-8123}
      DLT_CLICKHOUSE_USER: ${DLT_CLICKHOUSE_USER:-dlt}
      DLT_CLICKHOUSE_PASSWORD: ${DLT_CLICKHOUSE_PASSWORD}
      DLT_CLICKHOUSE_DB: ${DLT_CLICKHOUSE_DB:-dlt}
      # beefy db source configuration
      BEEFY_DB_HOST: ${BEEFY_DB_HOST:-postgres}
      BEEFY_DB_PORT: ${BEEFY_DB_PORT:-5432}
      BEEFY_DB_NAME: ${BEEFY_DB_NAME:-beefy-db}
      BEEFY_DB_USER: ${BEEFY_DB_USER:-postgres}
      BEEFY_DB_PASSWORD: ${BEEFY_DB_PASSWORD}
      BEEFY_DB_SSLMODE: ${BEEFY_DB_SSLMODE:-require}
      BEEFY_TIMESCALEDB_HOST: ${BEEFY_TIMESCALEDB_HOST}
      BEEFY_TIMESCALEDB_PORT: ${BEEFY_TIMESCALEDB_PORT:-5432}
      BEEFY_TIMESCALEDB_NAME: ${BEEFY_TIMESCALEDB_NAME:-tsdb}
      BEEFY_TIMESCALEDB_USER: ${BEEFY_TIMESCALEDB_USER:-tsdbadmin}
      BEEFY_TIMESCALEDB_PASSWORD: ${BEEFY_TIMESCALEDB_PASSWORD}
      BEEFY_TIMESCALEDB_SSLMODE: ${BEEFY_TIMESCALEDB_SSLMODE:-require}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    networks:
      - backend_network
    restart: on-failure
    labels:
      - "traefik.enable=false"
    depends_on:
      clickhouse:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'scheduler.py' > /dev/null && exit 0 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "local"
      options:
        max-size: "1G"
        max-file: "3"

  api:
    build:
      context: ../..
      dockerfile: infra/api/Dockerfile
    image: beefy-databarn-api:latest
    environment:
      API_CLICKHOUSE_HOST: ${API_CLICKHOUSE_HOST:-clickhouse}
      API_CLICKHOUSE_PORT: 8123
      API_CLICKHOUSE_USER: ${API_CLICKHOUSE_USER:-api}
      API_CLICKHOUSE_PASSWORD: ${API_CLICKHOUSE_PASSWORD}
      API_CLICKHOUSE_DB: ${API_CLICKHOUSE_DB:-analytics}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-100}
      API_CACHE_TTL_SECONDS: ${API_CACHE_TTL_SECONDS:-3600}
    networks:
      - backend_network
      - frontend_network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=beefy-databarn_frontend_network"
      # Only allow /api/v1 paths through Traefik - blocks /health, /metrics, etc. from external access
      # No stripprefix needed since API routes already include /api/v1 prefix
      - "traefik.http.routers.api.rule=Host(`${API_WEBAPP_DOMAIN_NAME}`) && (PathPrefix(`/api/v1`) || Path(`/docs`) || Path(`/redoc`) || Path(`/openapi.json`))"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
      - "traefik.http.services.api.loadbalancer.server.scheme=http"
      - "traefik.http.services.api.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.api.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.api.loadbalancer.healthcheck.timeout=5s"
      - "traefik.http.routers.api.service=api"
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "local"
      options:
        max-size: "1G"
        max-file: "3"


volumes:
  clickhouse_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_DIR}/clickhouse
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_DIR}/prometheus
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_DIR}/grafana
  rustfs_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_DIR}/rustfs
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_DIR}/postgres
  superset_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_DIR}/superset
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_DIR}/redis
  traefik_certs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_DIR}/traefik_certs
  dbt_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_DIR}/dbt
  dbt_docs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_DIR}/dbt-docs
  dlt_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_DIR}/dlt
  beefy_history_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_DIR}/beefy-history

networks:
  frontend_network:
    driver: bridge
    name: beefy-databarn_frontend_network
    ipam:
      config:
        - subnet: 172.19.0.0/24
          gateway: 172.19.0.1
  backend_network:
    driver: bridge
    name: beefy-databarn_backend_network
    ipam:
      config:
        - subnet: 172.19.1.0/24
          gateway: 172.19.1.1
